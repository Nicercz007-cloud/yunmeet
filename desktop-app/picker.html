<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>选择要共享的内容</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: #15181e;
    color: #e8eaf0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #262b34;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header button {
    background: #2c6bed;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { background: #3b7bff; }
  #grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-content: start;
  }
  .item {
    background: #1d2129;
    border: 2px solid #262b34;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .item:hover { border-color: #2c6bed; background: #202633; }
  .item img.thumb {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 6px;
    background: #10131a;
    display: block;
  }
  .label {
    margin-top: 8px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .badge {
    flex: none;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: #2c6bed;
    color: #fff;
  }
  .badge.window { background: #5a6472; }
  .empty { grid-column: 1 / -1; text-align: center; color: #8b93a1; padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>选择要共享的内容</h1>
    <button id="cancel">取消</button>
  </header>
  <div id="grid"><div class="empty">正在获取屏幕和窗口…</div></div>
<script>
  const grid = document.getElementById('grid');
  function render(list) {
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<div class="empty">没有可共享的屏幕或窗口</div>';
      return;
    }
    for (const s of list) {
      const div = document.createElement('div');
      div.className = 'item';
      const img = document.createElement('img');
      img.className = 'thumb';
      if (s.thumb) img.src = s.thumb;
      const label = document.createElement('div');
      label.className = 'label';
      const badge = document.createElement('span');
      badge.className = 'badge' + (s.type === 'window' ? ' window' : '');
      badge.textContent = s.type === 'screen' ? '屏幕' : '窗口';
      const name = document.createElement('span');
      name.textContent = s.name || s.id;
      name.style.overflow = 'hidden';
      name.style.textOverflow = 'ellipsis';
      label.appendChild(badge);
      label.appendChild(name);
      div.appendChild(img);
      div.appendChild(label);
      div.addEventListener('click', () => window.yunmeetDesktop.picker.pick(s.id));
      grid.appendChild(div);
    }
  }
  document.getElementById('cancel').addEventListener('click', () => window.yunmeetDesktop.picker.cancel());
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.yunmeetDesktop.picker.cancel(); });
  window.yunmeetDesktop.picker.onSources(render);
</script>
</body>
</html>
